<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SafeDrive Simulator</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}
body {
  background: var(--pickle-surface-page, #0f1216);
  color: var(--pickle-text-primary, #f0f3f6);
  font: var(--pickle-type-body, normal 14px/1.4 system-ui, -apple-system, sans-serif);
  padding: var(--pickle-inset-screen-x, 16px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--pickle-border-hairline, rgba(255,255,255,0.08));
}
.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 16px;
  color: #0072ce;
}
.badge {
  background: rgba(0, 114, 206, 0.15);
  color: #0072ce;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: var(--pickle-radius-pill, 12px);
  border: 1px solid rgba(0, 114, 206, 0.3);
}
.telemetry-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.tele-box {
  background: var(--pickle-surface-card, #171b22);
  border: 1px solid var(--pickle-border-hairline, rgba(255,255,255,0.06));
  border-radius: var(--pickle-radius-tile, 8px);
  padding: 10px;
  text-align: center;
}
.tele-label {
  font-size: 11px;
  color: var(--pickle-text-secondary, #8b949e);
  margin-bottom: 4px;
}
.tele-val {
  font-size: 16px;
  font-weight: 700;
  color: var(--pickle-text-primary, #fff);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.wheel-icon {
  width: 18px;
  height: 18px;
  transition: transform 0.2s ease-out;
  display: inline-block;
}
.main-display {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.gauge-card {
  background: var(--pickle-surface-card, #171b22);
  border: 1px solid var(--pickle-border-hairline, rgba(255,255,255,0.08));
  border-radius: var(--pickle-radius-card, 12px);
  padding: 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.gauge-header {
  font-size: 12px;
  color: var(--pickle-text-secondary, #8b949e);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.gauge-score {
  font-size: 56px;
  font-weight: 800;
  margin: 6px 0;
  transition: color 0.4s ease;
  line-height: 1;
}
.gauge-level {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
}
.meter-bg {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 5px;
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  width: 15%;
  border-radius: 5px;
  transition: width 0.4s ease, background-color 0.4s ease;
}
.concierge-card {
  background: linear-gradient(145deg, #1f242d, #171b22);
  border: 1px solid rgba(255, 152, 0, 0.4);
  border-radius: var(--pickle-radius-card, 12px);
  padding: 14px;
  display: none;
  animation: fadeIn 0.3s ease-out forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.concierge-title {
  color: #ff9800;
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.rest-name {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.rest-desc {
  font-size: 12px;
  color: var(--pickle-text-secondary, #aaa);
  line-height: 1.4;
  margin-bottom: 12px;
}
.concierge-btn {
  width: 100%;
  padding: 11px;
  background: #0072ce;
  border: none;
  border-radius: var(--pickle-radius-cta, 8px);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.concierge-btn:active {
  opacity: 0.85;
}
.concierge-btn.done {
  background: #4caf50;
  cursor: default;
}
.tts-box {
  background: rgba(0, 114, 206, 0.1);
  border-left: 3px solid #0072ce;
  border-radius: 0 8px 8px 0;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--pickle-text-primary, #ddd);
  display: flex;
  align-items: center;
  gap: 8px;
}
.tts-icon {
  font-size: 16px;
  flex-shrink: 0;
}
.tts-text {
  flex: 1;
}
.controls {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ctrl-title {
  font-size: 11px;
  color: var(--pickle-text-secondary, #8b949e);
  font-weight: 600;
}
.btn-group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.scenario-btn {
  background: var(--pickle-surface-card, #1c2128);
  border: 1px solid var(--pickle-border-control, rgba(255,255,255,0.12));
  border-radius: var(--pickle-radius-tile, 8px);
  color: var(--pickle-text-primary, #fff);
  padding: 10px 4px;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.scenario-btn.active {
  background: #0072ce;
  border-color: #0072ce;
  color: #fff;
}
.scenario-btn:active {
  transform: scale(0.97);
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span>🛡️ SafeDrive</span>
    <span class="badge">Pleos Automotive</span>
  </div>
  <div id="lka-indicator" style="font-size: 11px; color: #4caf50; font-weight: 600;">● LKA 정상 작동</div>
</div>

<div class="telemetry-row">
  <div class="tele-box">
    <div class="tele-label">차량 속도</div>
    <div class="tele-val"><span id="val-speed">98</span> <span style="font-size: 10px; color: #888;">km/h</span></div>
  </div>
  <div class="tele-box">
    <div class="tele-label">조향각 (Steering)</div>
    <div class="tele-val">
      <svg class="wheel-icon" id="wheel-svg" viewBox="0 0 24 24" fill="none" stroke="#0072ce" stroke-width="2">
        <circle cx="12" cy="12" r="9"/>
        <line x1="12" y1="3" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
      </svg>
      <span id="val-steering">0.0°</span>
    </div>
  </div>
  <div class="tele-box">
    <div class="tele-label">연속 주행</div>
    <div class="tele-val"><span id="val-time">45</span> <span style="font-size: 10px; color: #888;">분</span></div>
  </div>
</div>

<div class="main-display">
  <div class="gauge-card">
    <div class="gauge-header">실시간 운전자 피로 지수 (Fatigue Score)</div>
    <div class="gauge-score" id="fatigue-score" style="color: #4caf50;">15</div>
    <div class="gauge-level" id="fatigue-level">정상 주행 (안정 패턴)</div>
    <div class="meter-bg">
      <div class="meter-fill" id="meter-bar" style="width: 15%; background: #4caf50;"></div>
    </div>
  </div>

  <div class="concierge-card" id="concierge-card">
    <div class="concierge-title">☕ 스마트 휴식 컨시어지 제안</div>
    <div class="rest-name">⭐ 안성휴게소 (부산방향) · 전방 4.2km</div>
    <div class="rest-desc">
      주차 여유 (여유) | 대표메뉴: 원조 소떡소떡, 안성국밥<br>
      입점 카페: 스타벅스, 투썸플레이스
    </div>
    <button class="concierge-btn" id="btn-waypoint" onclick="addWaypoint()">경유지로 등록 (원클릭)</button>
  </div>

  <div class="tts-box">
    <span class="tts-icon">🎙️</span>
    <span class="tts-text" id="tts-msg">안정적인 주행 상태를 유지하고 있습니다.</span>
  </div>
</div>

<div class="controls">
  <div class="ctrl-title">주행 시연 시뮬레이터 (직접 터치해 보세요):</div>
  <div class="btn-group">
    <button class="scenario-btn active" id="btn-sc-normal" onclick="setScenario('normal')">1. 정상 주행</button>
    <button class="scenario-btn" id="btn-sc-caution" onclick="setScenario('caution')">2. 피로 주의</button>
    <button class="scenario-btn" id="btn-sc-danger" onclick="setScenario('danger')">3. 위험 졸음</button>
  </div>
</div>

<script>
let state = {
  scenario: 'normal', // normal, caution, danger
  score: 15,
  speed: 98,
  steering: 0.0,
  time: 45,
  lkaCount: 0,
  waypointAdded: false,
  metrics: {
    scenario_level: 0,
    fatigue_score: 15,
    waypoint_added: 0
  }
};

let lastSignalTime = 0;

if (window.pickle && window.pickle.widget && window.pickle.widget.state) {
  state = Object.assign(state, window.pickle.widget.state);
}

function sendSignalThrottled(msg) {
  const now = Date.now();
  if (now - lastSignalTime > 3000) {
    lastSignalTime = now;
    if (window.pickle && window.pickle.widget && window.pickle.widget.signal) {
      window.pickle.widget.signal(msg);
    }
  }
}

async function saveState() {
  if (window.pickle && window.pickle.widget && window.pickle.widget.save) {
    try {
      await window.pickle.widget.save(state);
    } catch(e) {}
  }
}

function setScenario(sc, fromUser = true) {
  state.scenario = sc;
  if (sc === 'normal') {
    state.score = 15;
    state.speed = 98;
    state.time = 45;
    state.lkaCount = 0;
    state.waypointAdded = false;
    state.metrics.scenario_level = 0;
    if (fromUser) sendSignalThrottled("사용자가 시뮬레이터에서 1단계 정상 주행 상태로 전환했습니다.");
  } else if (sc === 'caution') {
    state.score = 65;
    state.speed = 94;
    state.time = 105;
    state.lkaCount = 2;
    state.waypointAdded = false;
    state.metrics.scenario_level = 1;
    if (fromUser) sendSignalThrottled("사용자가 시뮬레이터에서 2단계 피로 주의 상태를 실행하여 차내 환기 및 리프레시 음악이 제안되었습니다.");
  } else if (sc === 'danger') {
    state.score = 88;
    state.speed = 89;
    state.time = 145;
    state.lkaCount = 6;
    state.metrics.scenario_level = 2;
    if (fromUser) sendSignalThrottled("사용자가 시뮬레이터에서 3단계 위험 졸음 상태를 실행하여 안성휴게소 추천 카드가 표출되었습니다.");
  }
  state.metrics.fatigue_score = state.score;
  render();
  saveState();
}

function addWaypoint() {
  if (state.waypointAdded) return;
  state.waypointAdded = true;
  state.metrics.waypoint_added = 1;
  render();
  saveState();
  sendSignalThrottled("사용자가 안성휴게소를 내비게이션 경유지로 원클릭 등록했습니다.");
}

function render() {
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-sc-' + state.scenario).classList.add('active');

  document.getElementById('val-speed').textContent = Math.round(state.speed);
  document.getElementById('val-steering').textContent = state.steering.toFixed(1) + '°';
  document.getElementById('val-time').textContent = state.time;
  document.getElementById('wheel-svg').style.transform = `rotate(${state.steering * 3}deg)`;

  const scoreEl = document.getElementById('fatigue-score');
  const levelEl = document.getElementById('fatigue-level');
  const meterEl = document.getElementById('meter-bar');
  const ttsEl = document.getElementById('tts-msg');
  const cardEl = document.getElementById('concierge-card');
  const lkaEl = document.getElementById('lka-indicator');

  scoreEl.textContent = state.score;
  meterEl.style.width = state.score + '%';

  if (state.score < 50) {
    scoreEl.style.color = '#4caf50';
    meterEl.style.backgroundColor = '#4caf50';
    levelEl.textContent = '정상 주행 (안정 패턴)';
    levelEl.style.color = '#4caf50';
    ttsEl.textContent = '안정적인 주행 상태를 유지하고 있습니다.';
    cardEl.style.display = 'none';
    lkaEl.textContent = '● LKA 정상 작동';
    lkaEl.style.color = '#4caf50';
  } else if (state.score < 80) {
    scoreEl.style.color = '#ff9800';
    meterEl.style.backgroundColor = '#ff9800';
    levelEl.textContent = '피로 주의 (리프레시 권장)';
    levelEl.style.color = '#ff9800';
    ttsEl.textContent = '미세 조향 떨림 감지! 창문을 열어 환기하고 리프레시 음악을 재생합니다.';
    cardEl.style.display = 'none';
    lkaEl.textContent = '▲ 차선 흔들림 감지 (보조 2회)';
    lkaEl.style.color = '#ff9800';
  } else {
    scoreEl.style.color = '#f44336';
    meterEl.style.backgroundColor = '#f44336';
    levelEl.textContent = '위험 졸음 (휴게소 휴식 필요)';
    levelEl.style.color = '#f44336';
    if (state.waypointAdded) {
      ttsEl.textContent = '안성휴게소가 내비게이션 경유지로 등록되었습니다. 4.2km 후 안전하게 쉬어가세요.';
    } else {
      ttsEl.textContent = '종원님, 4km 앞 안성휴게소에 들러보세요. 주차 여유가 있고 소떡소떡이 준비되어 있습니다.';
    }
    cardEl.style.display = 'block';
    lkaEl.textContent = '⚠ 차선 이탈 보조 긴급 개입 (' + state.lkaCount + '회)';
    lkaEl.style.color = '#f44336';
  }

  const btnWaypoint = document.getElementById('btn-waypoint');
  if (state.waypointAdded) {
    btnWaypoint.textContent = '✅ 내비 경유지 등록 완료';
    btnWaypoint.classList.add('done');
  } else {
    btnWaypoint.textContent = '경유지로 등록 (원클릭)';
    btnWaypoint.classList.remove('done');
  }
}

// Telemetry animation loop
setInterval(() => {
  let delta = 0;
  if (state.scenario === 'normal') {
    delta = (Math.random() - 0.5) * 1.5;
  } else if (state.scenario === 'caution') {
    delta = (Math.random() - 0.5) * 5.0;
  } else {
    delta = (Math.random() - 0.5) * 14.0;
  }
  state.steering = Math.max(-45, Math.min(45, state.steering + delta * 0.4));
  document.getElementById('val-steering').textContent = state.steering.toFixed(1) + '°';
  document.getElementById('wheel-svg').style.transform = `rotate(${state.steering * 3}deg)`;
}, 400);

if (window.pickle && window.pickle.widget) {
  window.pickle.widget.onstate = (next) => {
    state = next;
    render();
  };

  window.pickle.widget.oncommand = (command) => {
    const [word, ...args] = command.trim().split(/\s+/);
    if (word === 'scenario') {
      const target = args[0] || 'normal';
      if (['normal', 'caution', 'danger'].includes(target)) {
        setScenario(target, false);
      }
    } else if (word === 'waypoint') {
      addWaypoint();
    } else if (word === 'reset') {
      setScenario('normal', false);
    }
  };
}

render();
</script>
</body>
</html>
